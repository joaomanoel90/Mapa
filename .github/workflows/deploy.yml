name: Deploy para o GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Garantir que o Pages publique via GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          atual=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" | python3 -c "import sys,json; print(json.load(sys.stdin).get('build_type','desconhecido'))" 2>/dev/null || echo "desconhecido")
          echo "Origem atual do Pages: $atual"

          if [ "$atual" = "workflow" ]; then
            echo "Já está configurado para publicar via GitHub Actions."
            exit 0
          fi

          echo "Trocando de $atual para build via GitHub Actions..."
          resp=$(curl -sS -w "\n%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"build_type":"workflow"}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')
          echo "Resposta da API (HTTP $code): $body"

          if [ "$code" = "200" ] || [ "$code" = "204" ]; then
            echo "Pronto: o Pages agora publica via GitHub Actions."
          else
            echo "::warning::Nao foi possivel trocar a origem do Pages automaticamente (HTTP $code)."
            echo "::warning::Va em Settings -> Pages -> Source e escolha 'GitHub Actions'."
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
