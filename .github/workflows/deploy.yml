name: Deploy para o GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Garantir que o Pages publique via GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          atual=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || echo "desconhecido")
          echo "Origem atual do Pages: $atual"
          if [ "$atual" != "workflow" ]; then
            echo "Trocando de $atual para build via GitHub Actions..."
            if gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow >/dev/null 2>&1; then
              echo "Origem agora: $(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')"
            else
              echo "::warning::Nao foi possivel trocar a origem do Pages automaticamente."
              echo "::warning::Va em Settings -> Pages -> Source e escolha 'GitHub Actions'."
            fi
          else
            echo "Já está configurado para publicar via GitHub Actions."
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
